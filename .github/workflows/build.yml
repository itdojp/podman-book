name: Build and Deploy (Node.js Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Temporary opt-in during GitHub Actions' Node 20 -> Node 24 transition.
  # Ref: https://github.blog/changelog/2026-03-06-github-actions-transitions-from-node-20-to-node-24/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: npm ci

    - name: Security audit
      run: npm run check:security

    - name: Metadata consistency check
      run: npm run check:metadata

    - name: Figure index contract check
      run: npm run check:figure-index

    - name: Podman backend contract check
      run: npm run check:podman-backends

    - name: Podman machine path contract check
      run: npm run check:podman-machine-paths
        
    - name: Build book
      run: npm run build
      
    - name: Deploy to docs folder
      if: github.ref == 'refs/heads/main'
      run: |
        # Copy build output to docs folder
        rm -rf docs/*
        cp -r dist/* docs/
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Commit and push changes
        git add docs/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-deploy: Update docs from Node.js build"
          git push
        fi
