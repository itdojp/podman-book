<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <title>Podman → Kubernetes 移行パスウェイ</title>
  <desc>PodmanからKubernetesへの4段階移行プロセスとYAML生成フローの詳細図</desc>
  <defs>
    <style>
      :root {
        --svg-bg: #ffffff;
        --svg-text: #1a1a1a;
        --svg-primary: #0066cc;
        --svg-success: #16a34a;
        --svg-warning: #ca8a04;
        --svg-error: #dc2626;
        --svg-neutral: #6b7280;
      }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 16px; font-weight: 600; fill: var(--svg-text); }
      .phase-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 12px; font-weight: 500; fill: var(--svg-bg); }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 12px; font-weight: 400; fill: var(--svg-text); }
      .annotation-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; font-size: 10px; font-weight: 400; fill: var(--svg-neutral); }
      .phase1-box { fill: var(--svg-warning); stroke: var(--svg-warning); stroke-width: 2; }
      .phase2-box { fill: var(--svg-primary); stroke: var(--svg-primary); stroke-width: 2; }
      .phase3-box { fill: var(--svg-success); stroke: var(--svg-success); stroke-width: 2; }
      .phase4-box { fill: var(--svg-error); stroke: var(--svg-error); stroke-width: 2; }
      .migration-arrow { stroke: var(--svg-primary); stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .generate-flow { stroke: var(--svg-success); stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="var(--svg-primary)"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="var(--svg-success)"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" class="title-text" text-anchor="middle">Podman → Kubernetes 移行パスウェイ</text>

  <!-- Phase 1: Podman Standalone -->
  <g id="phase1">
    <rect x="60" y="80" width="160" height="120" class="phase1-box" rx="4"/>
    <text x="140" y="100" class="phase-title" text-anchor="middle">Phase 1</text>
    <text x="140" y="115" class="phase-title" text-anchor="middle">Podman単体</text>
    
    <rect x="80" y="130" width="120" height="60" fill="var(--svg-bg)" stroke="var(--svg-warning)" stroke-width="1" rx="4"/>
    <text x="140" y="145" class="step-text" text-anchor="middle" font-weight="500">コンテナ実行</text>
    <text x="90" y="160" class="annotation-text">• podman run</text>
    <text x="90" y="175" class="annotation-text">• 単一コンテナ</text>
    <text x="90" y="185" class="annotation-text">• ローカル開発</text>
  </g>

  <!-- Phase 2: Pod Usage -->
  <g id="phase2">
    <rect x="240" y="80" width="160" height="120" class="phase2-box" rx="4"/>
    <text x="320" y="100" class="phase-title" text-anchor="middle">Phase 2</text>
    <text x="320" y="115" class="phase-title" text-anchor="middle">Pod活用</text>
    
    <rect x="260" y="130" width="120" height="60" fill="var(--svg-bg)" stroke="var(--svg-primary)" stroke-width="1" rx="4"/>
    <text x="320" y="145" class="step-text" text-anchor="middle" font-weight="500">マルチコンテナ</text>
    <text x="270" y="160" class="annotation-text">• podman pod create</text>
    <text x="270" y="175" class="annotation-text">• 複数コンテナ</text>
    <text x="270" y="185" class="annotation-text">• 共有名前空間</text>
  </g>

  <!-- Phase 3: YAML Generation -->
  <g id="phase3">
    <rect x="420" y="80" width="160" height="120" class="phase3-box" rx="4"/>
    <text x="500" y="100" class="phase-title" text-anchor="middle">Phase 3</text>
    <text x="500" y="115" class="phase-title" text-anchor="middle">YAML生成</text>
    
    <rect x="440" y="130" width="120" height="60" fill="var(--svg-bg)" stroke="var(--svg-success)" stroke-width="1" rx="4"/>
    <text x="500" y="145" class="step-text" text-anchor="middle" font-weight="500">K8s マニフェスト</text>
    <text x="450" y="160" class="annotation-text">• podman generate kube</text>
    <text x="450" y="175" class="annotation-text">• YAML出力</text>
    <text x="450" y="185" class="annotation-text">• 互換性確認</text>
  </g>

  <!-- Phase 4: Kubernetes -->
  <g id="phase4">
    <rect x="600" y="80" width="160" height="120" class="phase4-box" rx="4"/>
    <text x="680" y="100" class="phase-title" text-anchor="middle">Phase 4</text>
    <text x="680" y="115" class="phase-title" text-anchor="middle">Kubernetes</text>
    
    <rect x="620" y="130" width="120" height="60" fill="var(--svg-bg)" stroke="var(--svg-error)" stroke-width="1" rx="4"/>
    <text x="680" y="145" class="step-text" text-anchor="middle" font-weight="500">本番運用</text>
    <text x="630" y="160" class="annotation-text">• kubectl apply</text>
    <text x="630" y="175" class="annotation-text">• クラスター運用</text>
    <text x="630" y="185" class="annotation-text">• スケーリング</text>
  </g>

  <!-- Migration Arrows -->
  <path d="M 220 140 L 240 140" class="migration-arrow"/>
  <path d="M 400 140 L 420 140" class="migration-arrow"/>
  <path d="M 580 140 L 600 140" class="migration-arrow"/>

  <!-- YAML Generation Workflow -->
  <g id="yaml-workflow">
    <rect x="80" y="230" width="640" height="200" fill="var(--svg-success)" fill-opacity="0.05" stroke="var(--svg-success)" stroke-width="2" rx="4"/>
    <text x="400" y="250" class="step-text" text-anchor="middle" font-weight="500">YAML生成ワークフロー詳細</text>
    
    <!-- Step 1: Pod Creation -->
    <rect x="100" y="270" width="140" height="60" fill="var(--svg-bg)" stroke="var(--svg-success)" stroke-width="1" rx="4"/>
    <text x="170" y="285" class="step-text" text-anchor="middle" font-weight="500">1. Pod作成</text>
    <text x="110" y="300" class="annotation-text">podman pod create</text>
    <text x="110" y="315" class="annotation-text">--name web-app</text>
    <text x="110" y="325" class="annotation-text">-p 8080:80</text>
    
    <!-- Step 2: Container Addition -->
    <rect x="260" y="270" width="140" height="60" fill="var(--svg-bg)" stroke="var(--svg-success)" stroke-width="1" rx="4"/>
    <text x="330" y="285" class="step-text" text-anchor="middle" font-weight="500">2. コンテナ追加</text>
    <text x="270" y="300" class="annotation-text">podman run --pod</text>
    <text x="270" y="315" class="annotation-text">web-app nginx</text>
    <text x="270" y="325" class="annotation-text">app:latest</text>
    
    <!-- Step 3: YAML Generation -->
    <rect x="420" y="270" width="140" height="60" fill="var(--svg-bg)" stroke="var(--svg-success)" stroke-width="1" rx="4"/>
    <text x="490" y="285" class="step-text" text-anchor="middle" font-weight="500">3. YAML生成</text>
    <text x="430" y="300" class="annotation-text">podman generate</text>
    <text x="430" y="315" class="annotation-text">kube web-app</text>
    <text x="430" y="325" class="annotation-text">> k8s.yaml</text>
    
    <!-- Step 4: Verification -->
    <rect x="580" y="270" width="140" height="60" fill="var(--svg-bg)" stroke="var(--svg-success)" stroke-width="1" rx="4"/>
    <text x="650" y="285" class="step-text" text-anchor="middle" font-weight="500">4. 検証・デプロイ</text>
    <text x="590" y="300" class="annotation-text">kubectl apply</text>
    <text x="590" y="315" class="annotation-text">-f k8s.yaml</text>
    <text x="590" y="325" class="annotation-text">--dry-run</text>
    
    <!-- Generated YAML Example -->
    <rect x="100" y="350" width="620" height="70" fill="var(--svg-bg)" stroke="var(--svg-neutral)" stroke-width="1" rx="4"/>
    <text x="400" y="365" class="step-text" text-anchor="middle" font-weight="500">生成されるKubernetes YAML例</text>
    <text x="120" y="380" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">apiVersion: v1</text>
    <text x="120" y="395" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">kind: Pod</text>
    <text x="120" y="410" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">metadata: {name: web-app}</text>
    <text x="400" y="380" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">spec:</text>
    <text x="400" y="395" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">  containers: [...nginx, app...]</text>
    <text x="400" y="410" class="annotation-text" font-family="'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace">  restartPolicy: OnFailure</text>
  </g>

  <!-- Generation Flow Arrows -->
  <path d="M 240 300 L 260 300" class="generate-flow"/>
  <path d="M 400 300 L 420 300" class="generate-flow"/>
  <path d="M 560 300 L 580 300" class="generate-flow"/>

  <!-- Compatibility Matrix -->
  <g id="compatibility">
    <rect x="100" y="450" width="600" height="120" fill="var(--svg-primary)" fill-opacity="0.05" stroke="var(--svg-primary)" stroke-width="2" rx="4"/>
    <text x="400" y="470" class="step-text" text-anchor="middle" font-weight="500">移行時の互換性と考慮事項</text>
    
    <!-- Supported Features -->
    <text x="120" y="490" class="annotation-text" font-weight="500">✓ サポート機能:</text>
    <text x="220" y="490" class="annotation-text">Pod、コンテナ、ボリューム、ポート、環境変数</text>
    
    <!-- Limited Features -->
    <text x="120" y="505" class="annotation-text" font-weight="500">△ 制限機能:</text>
    <text x="200" y="505" class="annotation-text">リソース制限、ヘルスチェック、セキュリティコンテキスト</text>
    
    <!-- Manual Configuration -->
    <text x="120" y="520" class="annotation-text" font-weight="500">✋ 手動設定:</text>
    <text x="200" y="520" class="annotation-text">Service、Ingress、ConfigMap、Secret</text>
    
    <!-- Best Practices -->
    <text x="120" y="535" class="annotation-text" font-weight="500">💡 ベストプラクティス:</text>
    <text x="250" y="535" class="annotation-text">段階的移行、テスト環境での検証、モニタリング設定</text>
    
    <!-- Migration Benefits -->
    <text x="120" y="550" class="annotation-text" font-weight="500">🚀 移行メリット:</text>
    <text x="220" y="550" class="annotation-text">開発〜本番の一貫性、CI/CD統合、学習コスト削減</text>
  </g>
</svg>